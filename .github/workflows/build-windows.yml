name: Build Windows exe

on:
  push:
    branches: [main]
    paths:
      - 'daily-tracker-desktop/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daily-tracker-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run build:win

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "DailyTracker (latest build)" \
              --notes "Automated build from commit $GITHUB_SHA"
          # DailyTracker.exe (portable, no notifications) retired in favor of an
          # installer -- required for Windows to register the AppUserModelID
          # that native toast notifications depend on.
          gh release delete-asset latest DailyTracker.exe --repo "$GITHUB_REPOSITORY" --yes || true
          gh release upload latest dist/DailyTracker-Setup.exe --repo "$GITHUB_REPOSITORY" --clobber

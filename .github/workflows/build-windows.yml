name: Build Windows exe

on:
  push:
    branches: [main]
    paths:
      - 'daily-tracker/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daily-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name "DailyTracker" app.py

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "DailyTracker (latest build)" \
              --notes "Automated build from commit $GITHUB_SHA"
          gh release upload latest dist/DailyTracker.exe --repo "$GITHUB_REPOSITORY" --clobber
